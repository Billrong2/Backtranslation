[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backtranslation-understandability"
version = "0.1.0"
description = "Reproducible code-to-directions-to-code understandability pilot"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema==4.25.1",
    "matplotlib==3.10.3",
    "numpy==2.2.6",
    "pytest==8.4.1",
    "rouge-score==0.1.2",
    "scipy==1.16.0",
    "statsmodels==0.14.5",
    "tokenizers==0.22.2",
    "torch==2.9.1",
    "transformers==4.57.6",
    "tree-sitter==0.25.2",
    "tree-sitter-java==0.23.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
